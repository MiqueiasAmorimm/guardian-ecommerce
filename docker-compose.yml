version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres
    restart: always
    environment:
      POSTGRES_DB: guardian_catalog
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: